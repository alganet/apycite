[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "apycite"
dynamic = ["version"]
description = "Keep the quote next to the code it justifies, and prove it is still in the source"
readme = "README.md"
license = "ISC"
authors = [{name = "Alexandre Gomes Gaigalas", email = "alganet@gmail.com"}]
keywords = ["citation", "quotes", "source", "verification", "comments", "lint"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# apysource is a hard dependency, not an optional one, and the reason is the
# round-trip guard: every run loads its own output back through apysource's real
# loader. A guard that silently does not run when the dependency is missing is
# precisely the thing this tool exists to prevent.
#
# A floor, and a real one: turning a name like `RFC 9110` into a url is apysource's
# — 0.5.0 is where it landed — and apycite cannot fall back to a copy of it. A copy
# is what this dependency exists to prevent.
#
# The floor is 0.5.2 now, and for a second real reason: 0.5.1–0.5.2 is where apysource
# learned to read the RFC text apycite's citations are written against — rejoining a
# token split at a line-wrap hyphen, dropping the running page header, resolving an
# appendix, and resolving an old-style indented heading, including the mixed RFC 1123
# shape that 0.5.2 completed. A cite this tool helps write is only as good as apysource's
# ability to find it again, so the two move together.
#
# 0.6.0 raises it again, for three things apycite now depends on outright.
# `SourceSet.base` — without it the sources file's `base:` is dropped from the
# generated file, and identifiers silently fall back to the `urn:apysource:`
# form that collides with every other project citing the same sentence.
# `apysource.serialize` — the RDF lane emits through apysource rather than
# restating what apysource RDF looks like. And deterministic blank-node labels:
# before them, serializing the same citations twice produced two different
# documents, so `extract --frozen` on a turtle file would have reported a diff
# on every commit. The turtle lane is not merely nicer on 0.6.0; it is wrong
# before it.
#
# 0.8.0 raises it for the same reason 0.5.2 did: it is where apysource learned to
# read the documents apycite's citations are written against. A section now owns
# its <pre> — the grammar block of every W3C and WHATWG source — so a section-scoped
# cite into one verifies on 0.8.0 and fails on anything older; an htmlized RFC
# rendition is read as HTML rather than as RFC text with the markup left in; and
# locate answers document-scoped instead of "not found" when only the document pins
# the quote. A cite this tool helps write is only as good as apysource's ability to
# find it again, so the two keep moving together.
#
# The floor is 0.8.1, not 0.8.0, and the difference is a lost quote rather than a
# missing feature: 0.8.0's new section walk skipped any content element wrapping a
# heading, and the HTML standard's unclosed `<p>` elements make that one `<p>` holding
# two headings and 7577 characters. Under 0.8.0 a section-scoped cite into that text
# extracts nothing and fails; under 0.7.0 and 0.8.1 it verifies. A floor exists for
# exactly the release that can refuse a citation this tool wrote.
#
# 0.9.0 raises it for a different kind of reason, and it is worth naming the
# difference. Every floor above was raised because a *quote became findable*: the
# old apysource would refuse a citation this tool had written, so the two moved
# together. This one is raised because the document apycite writes down changes
# **identity**. Below 0.9.0 a bare `- label: RFC 9110` is written out as
# `rfc9110.txt` with `type: text/plain`; at 0.9.0 it is written out as
# `rfc9110.html` with no type at all, because an RFC is no longer a content format
# apysource sniffs for but a repository that chooses which rendition answers.
#
# So the floor is not protecting a quote here, it is protecting a file. A project
# pinning the older apysource against the newer apycite would generate sources
# whose urls disagree with every other consumer of the same names, and
# `extract --frozen` would report that disagreement as apycite's own drift, on a
# commit that touched nothing near it.
#
# One consequence worth knowing: `--strict-repos` now covers RFCs, which it never
# did. They used to reach the generic fetcher, where a repo has nothing to say.
dependencies = [
    "apysource>=0.9.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/alganet/apycite"
Issues = "https://github.com/alganet/apycite/issues"

[project.scripts]
apycite = "apycite.cli.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "slipcover>=1.0",
    "mypy>=1.0",
    "ruff>=0.6",
    # apycite emits RDF now, and whether that RDF satisfies apysource's own SHACL
    # shapes is a thing the test suite must *check*, not skip. pyshacl is optional
    # for apysource — `conforms` returns "did not run" without it — so a suite that
    # merely imports it would go green having validated nothing, which is the
    # failure both these tools exist to abolish.
    "apysource[shacl]>=0.6.0",
]

[tool.setuptools.dynamic]
version = {attr = "apycite.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["apycite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the network and reads a real document (deselect with -m 'not live')",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
warn_return_any = true
check_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
